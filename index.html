<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدلية يقين ميثم الشاهر — نظام إدارة المرضى</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════
            المتغيرات والأساسيات (Modern SaaS Theme)
        ═══════════════════════════════════════════════ */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --secondary: #0f172a;
            --success: #10b981;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --background: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ═══════════════════════════════════════════════
            شاشة تسجيل الدخول
        ═══════════════════════════════════════════════ */
        .login-screen {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(-45deg, #eff6ff, #e0f2fe, #f8fafc, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px; z-index: 9999;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 48px 40px;
            border-radius: var(--radius-xl);
            width: 100%; max-width: 420px;
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.5) inset;
            border: 1px solid rgba(226, 232, 240, 0.8);
            text-align: center;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .login-logo {
            width: 80px; height: 80px;
            margin: 0 auto 24px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            box-shadow: var(--shadow-sm);
        }

        .login-card h1 { font-size: 1.5rem; font-weight: 800; color: var(--secondary); margin-bottom: 8px; }
        .login-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 32px; font-weight: 500; }

        .input-group { margin-bottom: 20px; text-align: right; position: relative; }
        .input-group label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; color: var(--secondary); }
        .input-group input {
            width: 100%; padding: 14px 16px 14px 44px;
            border: 1.5px solid var(--border); border-radius: var(--radius-md);
            font-family: inherit; font-size: 0.95rem; transition: var(--transition);
            background: var(--surface);
        }
        .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
        .input-group .input-icon { position: absolute; bottom: 14px; left: 16px; font-size: 1.1rem; color: var(--text-muted); transition: var(--transition); }
        .input-group input:focus + .input-icon { color: var(--primary); }

        .login-btn {
            width: 100%; padding: 14px; border: none; border-radius: var(--radius-md);
            background: var(--primary); color: white;
            font-family: inherit; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: var(--shadow-md);
        }
        .login-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .login-error {
            margin-top: 16px; padding: 12px;
            background: var(--danger-light); color: var(--danger);
            border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600;
            display: none; animation: shake 0.4s ease;
        }
        .login-error.show { display: block; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

        .btn-spinner {
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
        }
        .login-btn.loading .btn-spinner { display: block; }
        .login-btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═══════════════════════════════════════════════
            التطبيق الرئيسي
        ═══════════════════════════════════════════════ */
        .app-container { max-width: 1200px; margin: 0 auto; padding: 24px; display: none; }

        /* Header & Tabs */
        .header {
            background: var(--surface); padding: 20px 32px; border-radius: var(--radius-xl);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-sm); margin-bottom: 32px; border: 1px solid var(--border);
        }
        .header-brand { display: flex; align-items: center; gap: 16px; }
        .header-logo {
            width: 50px; height: 50px; background: var(--primary-light); color: var(--primary);
            border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
        }
        .header-brand h1 { font-size: 1.25rem; font-weight: 800; color: var(--secondary); margin-bottom: 2px; }
        .header-brand p { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

        .logout-btn {
            padding: 10px 20px; background: var(--surface); color: var(--danger);
            border: 1px solid var(--border); border-radius: var(--radius-md);
            font-family: inherit; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px;
        }
        .logout-btn:hover { background: var(--danger-light); border-color: var(--danger); }

        .tabs {
            display: flex; gap: 8px; margin-bottom: 24px; background: #e2e8f0;
            padding: 6px; border-radius: var(--radius-lg); width: fit-content;
        }
        .tab-btn {
            padding: 12px 24px; border: none; background: transparent;
            border-radius: var(--radius-md); font-family: inherit; font-size: 0.95rem; font-weight: 700;
            color: var(--text-muted); cursor: pointer; transition: var(--transition);
        }
        .tab-btn:hover:not(.active) { color: var(--text-main); }
        .tab-btn.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

        /* Sections & Cards */
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--surface); border-radius: var(--radius-xl); padding: 32px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px;
        }
        .card h2 {
            font-size: 1.25rem; font-weight: 800; color: var(--secondary);
            margin-bottom: 24px; display: flex; align-items: center; gap: 10px;
        }
        .card h2::before { content: ''; width: 6px; height: 24px; background: var(--primary); border-radius: 4px; }

        /* Forms */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .form-group { margin-bottom: 24px; }
        .form-row .form-group { margin-bottom: 0; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--text-main); font-size: 0.95rem; }
        .form-control {
            width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md);
            font-family: inherit; font-size: 0.95rem; font-weight: 500;
            transition: var(--transition); background: var(--surface);
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
        .phone-input { direction: ltr; text-align: right; } /* لضبط أرقام الهاتف بشكل صحيح */

        .medications-list { display: flex; flex-direction: column; gap: 16px; }
        .medication-item {
            display: grid; grid-template-columns: 2fr 1.5fr auto; gap: 16px; align-items: start;
            padding: 20px; background: var(--surface-hover);
            border-radius: var(--radius-lg); border: 1px dashed var(--border); transition: var(--transition);
        }
        .medication-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .medication-item .form-group { margin-bottom: 0; }
        
        .file-input-wrapper { position: relative; }
        .medication-item input[type="file"] { position: absolute; opacity: 0; width: 0; height: 0; }
        .file-label {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px; background: #fff; color: var(--text-main);
            border-radius: var(--radius-md); font-weight: 700; font-size: 0.9rem;
            cursor: pointer; transition: var(--transition); border: 1px solid var(--border); text-align: center;
        }
        .file-label:hover { border-color: var(--primary); color: var(--primary); }
        .file-label.has-file { background: #ecfdf5; color: var(--success); border-color: #a7f3d0; }

        /* Buttons */
        .btn {
            padding: 14px 24px; border: none; border-radius: var(--radius-md);
            font-family: inherit; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; transition: var(--transition);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }
        .btn-danger { background: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; border-radius: var(--radius-sm); }

        .btn-add-med {
            width: 100%; margin-top: 16px; padding: 16px; border: 2px dashed var(--border);
            background: transparent; color: var(--text-muted); font-weight: 700; font-size: 0.95rem; border-radius: var(--radius-lg); cursor: pointer; transition: var(--transition);
        }
        .btn-add-med:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

        /* Search */
        .search-bar { position: relative; margin-bottom: 24px; }
        .search-bar input { width: 100%; padding: 16px 48px 16px 20px; border: 1px solid var(--border); border-radius: var(--radius-lg); font-family: inherit; font-size: 1rem; background: var(--surface-hover); transition: var(--transition); }
        .search-bar input:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-light); }
        .search-bar::before { content: "🔍"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; opacity: 0.5; }

        /* ═══════════════════════════════════════════════
            شبكة المرضى وتنظيم البطاقات (Accordion)
        ═══════════════════════════════════════════════ */
        .patients-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
        
        .patient-card {
            background: var(--surface); border-radius: var(--radius-lg); padding: 0;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            transition: var(--transition); display: flex; flex-direction: column; overflow: hidden;
        }
        .patient-card:hover { box-shadow: var(--shadow-md); border-color: #cbd5e1; }

        /* الهيدر القابل للضغط (Accordion Header) */
        .patient-header {
            padding: 20px 24px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            background: var(--surface); transition: var(--transition); user-select: none;
        }
        .patient-header:hover { background: var(--surface-hover); }
        
        .patient-info-main { display: flex; align-items: center; gap: 16px; }
        .patient-info-main .avatar {
            width: 48px; height: 48px; border-radius: 12px; background: var(--primary-light); color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; flex-shrink: 0;
        }
        .patient-name { font-size: 1.1rem; font-weight: 800; color: var(--secondary); margin-bottom: 2px; }
        .patient-meta { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        .expand-icon { font-size: 0.9rem; color: var(--text-muted); transition: transform 0.3s ease; }

        /* جسم البطاقة المنبثق (Accordion Body) */
        .patient-body { display: none; padding: 0 24px 24px; border-top: 1px solid var(--border); }
        .patient-body.show { display: block; animation: fadeIn 0.4s ease; padding-top: 20px; }

        /* رقم هاتف المريض في البطاقة */
        .patient-phone-display {
            display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; 
            color: var(--secondary); font-weight: 700; margin-bottom: 20px; 
            padding: 10px 16px; background: var(--surface-hover); 
            border-radius: var(--radius-md); border: 1px solid var(--border);
            text-decoration: none; transition: var(--transition);
        }
        .patient-phone-display:hover { border-color: var(--primary); background: var(--primary-light); }

        /* ترتيب عرض العلاجات مثل الفاتورة */
        .medications-display { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .med-display-item {
            display: flex; align-items: center; gap: 16px; padding: 12px 16px;
            background: #f8fafc; border-radius: var(--radius-md); border: 1px solid var(--border);
        }
        
        /* تأثير التلميح والتكبير للصورة */
        .med-img-wrapper { position: relative; width: 64px; height: 64px; border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; border: 1px solid var(--border); flex-shrink: 0; }
        .med-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .med-img-wrapper:hover img { filter: brightness(0.7) blur(1px); transform: scale(1.05); }
        .zoom-hint {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.75rem; font-weight: 700; opacity: 0; transition: var(--transition); pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .med-img-wrapper:hover .zoom-hint { opacity: 1; }

        .med-info { flex-grow: 1; display: flex; flex-direction: column; }
        .med-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
        .med-price { font-weight: 800; color: var(--primary); font-size: 1.05rem; }
        .med-price::after { content: ' د.ع'; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

        .card-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 16px; border-top: 1px dashed var(--border); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .emoji { font-size: 3.5rem; margin-bottom: 16px; display: block; opacity: 0.8; }
        .empty-state p { font-weight: 700; font-size: 1.1rem; }

        /* ═══════════════════════════════════════════════
            مودل تكبير الصور (Lightbox Modal)
        ═══════════════════════════════════════════════ */
        .image-modal {
            display: none; position: fixed; inset: 0; z-index: 12000;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
            align-items: center; justify-content: center; flex-direction: column;
        }
        .image-modal.show { display: flex; animation: fadeInModal 0.3s ease; }
        
        .image-modal img {
            max-width: 90vw; max-height: 80vh; border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: zoom-in; object-fit: contain;
        }
        .image-modal img.zoomed { transform: scale(1.6); cursor: zoom-out; }
        
        .close-modal {
            position: absolute; top: 20px; right: 30px; color: white;
            font-size: 40px; font-weight: bold; cursor: pointer; transition: color 0.3s;
        }
        .close-modal:hover { color: var(--danger); }
        
        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }

        /* Loading & Toast */
        .loading-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .loading-overlay.active { display: flex; }
        .spinner { width: 48px; height: 48px; border: 4px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        
        .toast {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--secondary); color: white; padding: 14px 28px;
            border-radius: 50px; font-weight: 700; font-size: 0.95rem; opacity: 0; transition: var(--transition); z-index: 11000; box-shadow: var(--shadow-lg); text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        @media (max-width: 768px) {
            .app-container { padding: 16px; }
            .header { padding: 16px; flex-direction: column; align-items: flex-start; gap: 16px; }
            .logout-btn { width: 100%; justify-content: center; }
            .tabs { width: 100%; flex-direction: column; }
            .tab-btn { justify-content: center; }
            .form-row { grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
            .medication-item { grid-template-columns: 1fr; }
            .card { padding: 20px; }
            .patients-grid { grid-template-columns: 1fr; }
            .patient-header { padding: 16px; }
            .patient-body { padding: 0 16px 16px; }
        }
    </style>
</head>
<body>

    <!-- مودل تكبير الصورة -->
    <div id="image-modal" class="image-modal">
        <span class="close-modal">×</span>
        <img id="expanded-image" alt="صورة العلاج المكبرة">
    </div>

    <!-- ═══════════ شاشة تسجيل الدخول ═══════════ -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">💊</div>
            <h1>صيدلية يقين ميثم الشاهر</h1>
            <p class="login-subtitle">نظام الإدارة الآمن</p>

            <form id="login-form" autocomplete="on">
                <div class="input-group">
                    <label for="login-email">البريد الإلكتروني</label>
                    <input type="email" id="login-email" placeholder="أدخل بريدك الإلكتروني" required autocomplete="username">
                    <span class="input-icon">📧</span>
                </div>
                <div class="input-group">
                    <label for="login-password">كلمة المرور</label>
                    <input type="password" id="login-password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                    <span class="input-icon">🔒</span>
                </div>
                <button type="submit" id="login-btn" class="login-btn">
                    <span class="btn-spinner"></span>
                    <span class="btn-text">تسجيل الدخول</span>
                </button>
            </form>
            <div id="login-error" class="login-error"></div>
        </div>
    </div>

    <!-- ═══════════ التطبيق الرئيسي ═══════════ -->
    <div id="main-app" class="app-container">
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">💊</div>
                <div>
                    <h1>صيدلية يقين ميثم الشاهر</h1>
                    <p>نظام إدارة المرضى والعلاجات</p>
                </div>
            </div>
            <button id="logout-btn" class="logout-btn">تسجيل الخروج</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="add-patient">إضافة مريض جديد</button>
            <button class="tab-btn" data-tab="manage-patients">سجل المرضى</button>
        </div>

        <!-- قسم إضافة مريض -->
        <section id="add-patient" class="section active">
            <div class="card">
                <h2>إضافة مريض جديد</h2>
                <form id="patient-form">
                    <input type="hidden" id="edit-patient-id" value="">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="patient-name">اسم المريض</label>
                            <input type="text" id="patient-name" class="form-control" placeholder="أدخل اسم المريض الكامل" required>
                        </div>
                        <div class="form-group">
                            <label for="patient-phone">رقم الهاتف</label>
                            <input type="tel" id="patient-phone" class="form-control phone-input" placeholder="07XX XXX XXXX">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>العلاجات المرفقة</label>
                        <div id="medications-list" class="medications-list"></div>
                        <button type="button" id="add-med-btn" class="btn-add-med">+ إضافة علاج آخر</button>
                    </div>

                    <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; margin-top:16px;">
                        حفظ بيانات المريض
                    </button>
                </form>
            </div>
        </section>

        <!-- قسم إدارة المرضى -->
        <section id="manage-patients" class="section">
            <div class="card">
                <h2>قائمة المرضى</h2>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="ابحث باسم المريض أو رقم الهاتف...">
                </div>
                <div id="patients-grid" class="patients-grid"></div>
                <div id="empty-state" class="empty-state" style="display:none;">
                    <span class="emoji">📭</span>
                    <p>لا يوجد مرضى مسجلون بعد.</p>
                </div>
            </div>
        </section>
    </div>

    <!-- مؤشر التحميل -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- إشعار -->
    <div id="toast" class="toast"></div>

    <!-- ═══════════ JavaScript ═══════════ -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getDatabase, ref, push, set, onValue, update, remove, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

        // ─── إعدادات Firebase ───
        const firebaseConfig = {
            apiKey: "AIzaSyDE52nVKpKESr-gY6YBBECAdSgPDgQZpbg",
            authDomain: "yaqen-6856b.firebaseapp.com",
            databaseURL: "https://yaqen-6856b-default-rtdb.firebaseio.com",
            projectId: "yaqen-6856b",
            storageBucket: "yaqen-6856b.firebasestorage.app",
            messagingSenderId: "538885812800",
            appId: "1:538885812800:web:96c4b4348a2d4a024ca5a5",
            measurementId: "G-JHXD8ZXXD3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const patientsRef = ref(db, 'patients');
        const adminRef = ref(db, 'admin');
        const adminsRef = ref(db, 'admins');

        const CLOUD_NAME = 'fl3npkvv';
        const UPLOAD_PRESET = 'Postion';
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

        let patients = {};
        let editingPatientId = null;

        // عناصر DOM
        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');

        const tabs = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.section');
        const patientForm = document.getElementById('patient-form');
        const patientNameInput = document.getElementById('patient-name');
        const patientPhoneInput = document.getElementById('patient-phone');
        const editPatientIdInput = document.getElementById('edit-patient-id');
        const medicationsList = document.getElementById('medications-list');
        const addMedBtn = document.getElementById('add-med-btn');
        const submitBtn = document.getElementById('submit-btn');
        const patientsGrid = document.getElementById('patients-grid');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const loadingOverlay = document.getElementById('loading');
        const toastEl = document.getElementById('toast');

        // عناصر مودل تكبير الصورة
        const imageModal = document.getElementById('image-modal');
        const expandedImage = document.getElementById('expanded-image');
        const closeModal = document.querySelector('.close-modal');

        if (sessionStorage.getItem('pharmacy_logged_in') === 'true') {
            showMainApp();
        }

        async function verifyCredentials(email, password) {
            email = email.toLowerCase().trim();
            try {
                const snap = await get(adminRef);
                const admin = snap.val();
                if (admin && typeof admin === 'object') {
                    if (String(admin.email || admin.username || '').toLowerCase().trim() === email && String(admin.password || '') === password) return true;
                }
            } catch (e) {}

            try {
                const snap = await get(adminsRef);
                const admins = snap.val();
                if (admins && typeof admins === 'object') {
                    for (const key of Object.keys(admins)) {
                        const a = admins[key];
                        if (a && String(a.email || '').toLowerCase().trim() === email && String(a.password || '') === password) return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.remove('show');
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) return;
            if (!email.toLowerCase().endsWith('@admin.com')) { showLoginError('البريد الإلكتروني أو كلمة المرور غير صحيحة'); return; }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            try {
                const valid = await verifyCredentials(email, password);
                if (valid) {
                    sessionStorage.setItem('pharmacy_logged_in', 'true');
                    sessionStorage.setItem('pharmacy_admin_email', email.toLowerCase());
                    showMainApp();
                    showToast('مرحباً بك في لوحة التحكم 👋', 'success');
                    loginEmail.value = ''; loginPassword.value = '';
                } else {
                    showLoginError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
                }
            } catch (err) {
                showLoginError('⚠️ حدث خطأ في الاتصال بقاعدة البيانات');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        function showLoginError(msg) { loginError.textContent = msg; loginError.classList.add('show'); }

        logoutBtn.addEventListener('click', () => {
            if (!confirm('هل تريد تسجيل الخروج؟')) return;
            sessionStorage.removeItem('pharmacy_logged_in');
            mainApp.style.display = 'none';
            loginScreen.style.display = 'flex';
            showToast('تم تسجيل الخروج بنجاح', 'success');
        });

        function showMainApp() { loginScreen.style.display = 'none'; mainApp.style.display = 'block'; }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        function createMedicationRow(med = { imageUrl: '', price: '' }) {
            const row = document.createElement('div');
            row.className = 'medication-item';
            const uid = 'file-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);

            row.innerHTML = `
                <div class="form-group file-input-wrapper">
                    <input type="file" accept="image/*" class="med-image-input" id="${uid}">
                    <label class="file-label ${med.imageUrl ? 'has-file' : ''}" for="${uid}">
                        ${med.imageUrl ? '✅ تم اختيار الصورة' : '📷 رفع صورة العلاج'}
                    </label>
                    <input type="hidden" class="med-image-url" value="${med.imageUrl || ''}">
                    ${med.imageUrl ? `<img src="${med.imageUrl}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;margin-top:10px;display:block;border:1px solid #e2e8f0;">` : ''}
                </div>
                <div class="form-group">
                    <input type="number" class="form-control price-input" placeholder="السعر (د.ع)" value="${med.price || ''}" step="1" min="0">
                </div>
                <button type="button" class="btn btn-danger btn-sm remove-med-btn" title="حذف العلاج">حذف ✕</button>
            `;
            const fileInput = row.querySelector('.med-image-input');
            const fileLabel = row.querySelector('.file-label');
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    fileLabel.textContent = '✅ ' + fileInput.files[0].name;
                    fileLabel.classList.add('has-file');
                }
            });
            row.querySelector('.remove-med-btn').addEventListener('click', () => row.remove());
            return row;
        }

        addMedBtn.addEventListener('click', () => medicationsList.appendChild(createMedicationRow()));

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('فشل رفع الصورة');
            const data = await response.json();
            return data.secure_url;
        }

        patientForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = patientNameInput.value.trim();
            const phone = patientPhoneInput.value.trim(); // قراءة رقم الهاتف

            if (!name) { showToast('الرجاء إدخال اسم المريض', 'error'); return; }
            const medRows = medicationsList.querySelectorAll('.medication-item');
            if (medRows.length === 0) { showToast('الرجاء إضافة علاج واحد على الأقل', 'error'); return; }

            submitBtn.disabled = true; showLoading(true);
            try {
                const medications = [];
                for (const row of medRows) {
                    const fileInput = row.querySelector('.med-image-input');
                    const priceInput = row.querySelector('.price-input');
                    let imageUrl = row.querySelector('.med-image-url').value;
                    if (fileInput.files.length > 0) imageUrl = await uploadImage(fileInput.files[0]);
                    const price = priceInput.value.trim();
                    if (!price || !imageUrl) { showToast('الرجاء إكمال بيانات العلاجات (سعر وصورة)', 'error'); return; }
                    medications.push({ imageUrl, price: parseFloat(price) });
                }

                // تضمين رقم الهاتف في بيانات المريض
                const patientData = { name, phone, medications, updatedAt: Date.now() };

                if (editingPatientId) {
                    await update(ref(db, `patients/${editingPatientId}`), patientData);
                    showToast('تم تحديث بيانات المريض بنجاح ✅', 'success');
                } else {
                    patientData.createdAt = Date.now();
                    await set(push(patientsRef), patientData);
                    showToast('تمت إضافة المريض بنجاح ✅', 'success');
                }
                resetForm();
            } catch (error) {
                showToast(error.message || 'حدث خطأ أثناء الحفظ', 'error');
            } finally { showLoading(false); submitBtn.disabled = false; }
        });

        function resetForm() {
            patientNameInput.value = ''; 
            patientPhoneInput.value = ''; // تصفير رقم الهاتف
            editPatientIdInput.value = ''; 
            editingPatientId = null;
            submitBtn.innerHTML = 'حفظ بيانات المريض'; 
            medicationsList.innerHTML = '';
            medicationsList.appendChild(createMedicationRow());
        }

        onValue(patientsRef, (snapshot) => {
            patients = snapshot.val() || {};
            renderPatients(searchInput.value);
        });

        function renderPatients(filter = '') {
            const q = filter.trim().toLowerCase();
            const entries = Object.entries(patients)
                .filter(([id, p]) => {
                    const nameMatch = (p.name || '').toLowerCase().includes(q);
                    const phoneMatch = (p.phone || '').includes(q);
                    return !q || nameMatch || phoneMatch; // البحث يشمل الاسم ورقم الهاتف
                })
                .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

            if (entries.length === 0) {
                patientsGrid.innerHTML = ''; emptyState.style.display = 'block'; return;
            }

            emptyState.style.display = 'none';
            patientsGrid.innerHTML = entries.map(([id, patient]) => {
                const meds = patient.medications || [];
                const totalPrice = meds.reduce((sum, med) => sum + (med.price || 0), 0);
                
                return `
                <div class="patient-card" data-id="${id}">
                    <!-- الهيدر القابل للضغط (Accordion Header) -->
                    <div class="patient-header">
                        <div class="patient-info-main">
                            <span class="avatar">${escapeHtml((patient.name || '?').charAt(0))}</span>
                            <div>
                                <div class="patient-name">${escapeHtml(patient.name || 'بدون اسم')}</div>
                                <div class="patient-meta">علاجات: ${meds.length} | الإجمالي: ${formatNumber(totalPrice)} د.ع</div>
                            </div>
                        </div>
                        <div class="expand-icon">▼</div>
                    </div>
                    
                    <!-- جسم البطاقة المنسدل (Accordion Body) -->
                    <div class="patient-body">
                        
                        ${patient.phone ? `
                            <a href="tel:${escapeHtml(patient.phone)}" class="patient-phone-display" title="انقر للاتصال">
                                📞 ${escapeHtml(patient.phone)}
                            </a>
                        ` : ''}

                        <div class="medications-display">
                            ${meds.map(med => `
                                <div class="med-display-item">
                                    <div class="med-img-wrapper">
                                        <img src="${med.imageUrl}" alt="علاج" loading="lazy">
                                        <span class="zoom-hint">🔍 تكبير</span>
                                    </div>
                                    <div class="med-info">
                                        <div class="med-label">سعر العلاج</div>
                                        <div class="med-price">${formatNumber(med.price)}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-outline btn-sm edit-patient-btn" data-id="${id}">تعديل المريض</button>
                            <button class="btn btn-danger btn-sm delete-patient-btn" data-id="${id}">حذف المريض</button>
                        </div>
                    </div>
                </div>
            `}).join('');

            // ربط أحداث الضغط لفتح/إغلاق البطاقات (Accordion)
            document.querySelectorAll('.patient-header').forEach(header => {
                header.addEventListener('click', function() {
                    const body = this.nextElementSibling;
                    const icon = this.querySelector('.expand-icon');
                    const isShowing = body.classList.contains('show');
                    
                    document.querySelectorAll('.patient-body').forEach(b => b.classList.remove('show'));
                    document.querySelectorAll('.expand-icon').forEach(i => i.style.transform = 'rotate(0deg)');

                    if (!isShowing) {
                        body.classList.add('show');
                        icon.style.transform = 'rotate(180deg)';
                    }
                });
            });

            // ربط أحداث النقر لتكبير الصور (Lightbox)
            document.querySelectorAll('.med-img-wrapper').forEach(wrapper => {
                wrapper.addEventListener('click', (e) => {
                    const imgSrc = wrapper.querySelector('img').src;
                    openImageModal(imgSrc);
                });
            });

            document.querySelectorAll('.edit-patient-btn').forEach(btn => btn.addEventListener('click', () => editPatient(btn.dataset.id)));
            document.querySelectorAll('.delete-patient-btn').forEach(btn => btn.addEventListener('click', () => deletePatient(btn.dataset.id)));
        }

        function formatNumber(num) { return new Intl.NumberFormat('ar-IQ').format(num || 0); }

        function editPatient(id) {
            const p = patients[id]; if (!p) return;
            editingPatientId = id; 
            editPatientIdInput.value = id; 
            patientNameInput.value = p.name;
            patientPhoneInput.value = p.phone || ''; // وضع رقم الهاتف في حقل التعديل
            submitBtn.innerHTML = 'تحديث بيانات المريض'; 
            medicationsList.innerHTML = '';
            (p.medications || []).forEach(med => medicationsList.appendChild(createMedicationRow(med)));
            document.querySelector('[data-tab="add-patient"]').click();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('يمكنك الآن تعديل بيانات المريض', 'success');
        }

        async function deletePatient(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المريض وجميع بياناته؟')) return;
            showLoading(true);
            try { await remove(ref(db, `patients/${id}`)); showToast('تم حذف المريض ✅', 'success'); } 
            catch (err) { showToast('حدث خطأ أثناء الحذف', 'error'); } 
            finally { showLoading(false); }
        }

        searchInput.addEventListener('input', (e) => renderPatients(e.target.value));
        function showLoading(show) { loadingOverlay.classList.toggle('active', show); }
        function showToast(message, type = '') {
            toastEl.textContent = message; toastEl.className = 'toast show ' + type;
            clearTimeout(toastEl._timeout); toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), 3500);
        }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        /* ─── وظائف نافذة التكبير (Image Modal) ─── */
        function openImageModal(src) {
            expandedImage.src = src;
            expandedImage.classList.remove('zoomed');
            imageModal.classList.add('show');
        }

        closeModal.addEventListener('click', () => imageModal.classList.remove('show'));
        
        expandedImage.addEventListener('click', (e) => {
            e.stopPropagation();
            expandedImage.classList.toggle('zoomed');
        });

        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.remove('show');
            }
        });

        medicationsList.appendChild(createMedicationRow());
    </script>
</body>
</html>
